
# Project name
name: 'my_first_dbt_project'

# Project version
version: '1.0.0'

# Profile configured in ~/.dbt/profiles.yml
profile: 'my_first_dbt_project'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  my_first_dbt_project:
    my_first_dbt_model:
      +materialized: table
    dim_customers:
      +materialized: incremental
      +incremental_strategy: merge
      +unique_key: customer_id
